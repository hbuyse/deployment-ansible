---
- name: "Installation"
  hosts: localhost
  pre_tasks:
    - name: "Prepare installation"
      ansible.builtin.include_tasks:
        file: pre_tasks/main.yml
        apply:
          tags: always
      tags: always
  post_tasks:
    - name: "Finalize installation"
      ansible.builtin.include_tasks:
        file: post_tasks/main.yml
        apply:
          tags: always
      tags: always
  roles:
    - role: "nerdfonts"
      tags: nerdfonts
    - role: "rustup"
    - role: "zsh"
    - role: "foot"
      tags: foot
    - role: "alacritty"
    - role: "ghostty"
      tags: ghostty
    - role: "oh_my_posh"
      tags:
        - oh_my_posh
        - shell
    - role: "fastfetch"
    - role: "tmux"
    - role: "fzf"
    - role: "eza"
    - role: "bat"
    - role: "fd"
      tags: fd
    - role: "ripgrep"
    - role: "yazi"
    - role: "bottom"
    - role: "git"
    - role: "git_delta"
    - role: "lazygit"
    - role: "direnv"
    - role: "minicom"
      tags:
        - minicom
        - serial
    - role: "btop"
      tags: btop
