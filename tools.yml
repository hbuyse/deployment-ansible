---
- name: "Installation"
  hosts: localhost
  pre_tasks:
    - name: "Prepare installation"
      ansible.builtin.include_tasks:
        file: pre_tasks/main.yml
        apply:
          tags: always
      tags: always
  post_tasks:
    - name: "Finalize installation"
      ansible.builtin.include_tasks:
        file: post_tasks/main.yml
        apply:
          tags: always
      tags: always
  roles:
    # Configuration
    - role: "netrc"
      tags: netrc
    - role: "ssh"
      tags: ssh
    - role: "user"
      tags: user
    - role: "network"
      tags:
        - networkmanager
        - nmcli
    - role: "mimeapps"
      tags: mimeapps
    # Tools
    - role: "web_browsers"
      tags:
        - browser
        - browsers
        - web
    - role: "thunderbird"
      tags: thunderbird
    - role: "minicom"
      tags:
        - minicom
        - serial
    - role: "wireshark"
      tags: wireshark
    - role: "termshark"
    - role: "qemu_kvm"
    - role: "keymapp"
      tags: keymapp
    - role: "bitwarden"
      tags: bitwarden
    - role: "zoom"
      tags: zoom
      when: ansible_facts.hostname == "hbuyse-promax14"
    # Desktop client for cloud
    - role: "nextcloud"
    - role: "owncloud_client"
      when: ansible_facts.hostname == "hbuyse-promax14"
    # Web applications
    - role: "webapplications"
      tags: webapplications
    # CPU management
    - role: "tuned"
      tags: tuned
