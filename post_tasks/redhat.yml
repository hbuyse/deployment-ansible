---
- name: "Post-tasks | Update distro"
  become: true
  block:
    - name: "Post-tasks | Upgrade packages to latest version"
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: "Post-tasks | Clean cache of downloaded packages"
      ansible.builtin.shell:
        cmd: "dnf clean all"
