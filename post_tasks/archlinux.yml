---
- name: "Update distro"
  become: true
  block:
    - name: "Upgrade packages to latest version"
      community.general.pacman:
        upgrade: true
        state: "latest"
        update_cache: true

    - name: "Clean cache of downloaded packages"
      ansible.builtin.shell:
        cmd: "echo -e 'y\ny\n' | pacman -Scc"
