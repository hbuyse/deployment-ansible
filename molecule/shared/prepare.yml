---
# Preparation shared by the Molecule scenarios of the roles. A scenario selects what it needs with variables in the
# `inventory.group_vars.all` section of its molecule.yml:
#   molecule_packages / molecule_debian_packages / molecule_arch_packages: packages that a regular install has
#   molecule_user_dirs: directories of the home directory that the role expects to exist
#   molecule_user_session: start a systemd user manager for root, like the session of a desktop user
#   molecule_pipx: install pipx like a regular desktop would (the package on Arch, the pipx role on the Debian family
#     where the distribution one is too old for the pipx module), in ~/.local/bin where the roles look for it
# Anything more specific goes in a tasks/prepare.yml file next to molecule.yml.
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - name: Install Python and sudo on Arch
      ansible.builtin.raw: pacman -Syu --noconfirm python sudo
      when: inventory_hostname is match('.*-archlinux$')
      changed_when: true

- name: Prepare
  hosts: all
  gather_facts: true
  vars:
    ansible_user: root
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install the packages a regular install has
      ansible.builtin.package:
        name: "{{ molecule_packages | default([]) }}"
        state: present
      when: molecule_packages | default([]) | length > 0

    - name: Install the Debian family packages a regular install has
      ansible.builtin.apt:
        name: "{{ molecule_debian_packages | default([]) }}"
        state: present
      when:
        - ansible_facts.os_family == "Debian"
        - molecule_debian_packages | default([]) | length > 0

    - name: Install the Arch packages a regular install has
      community.general.pacman:
        name: "{{ molecule_arch_packages | default([]) }}"
        state: present
      when:
        - ansible_facts.os_family == "Archlinux"
        - molecule_arch_packages | default([]) | length > 0

    - name: Install pipx
      when: molecule_pipx | default(false) | bool
      block:
        - name: Install what the pipx role needs on the Debian family
          ansible.builtin.apt:
            name:
              - python3-venv
              - python3-pip
            state: present
          when: ansible_facts.os_family == "Debian"

        - name: Apply the pipx role
          ansible.builtin.include_role:
            name: "{{ [playbook_dir, '..', '..', 'roles', 'pipx'] | path_join }}"

        - name: Create the directory of the user binaries
          ansible.builtin.file:
            path: "{{ ansible_facts.user_dir }}/.local/bin"
            state: directory
            mode: "0755"

        - name: Link the pipx package in ~/.local/bin
          ansible.builtin.file:
            src: /usr/bin/pipx
            dest: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
            state: link
          when: ansible_facts.os_family == "Archlinux"

    - name: Create the directories that pre_tasks/main.yml creates
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ ['.config'] + (['.config/systemd/user'] if ansible_facts.service_mgr == 'systemd' else []) }}"

    - name: Create the directories of the home directory that the role expects
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ molecule_user_dirs | default([]) }}"

    - name: Prepare the systemd user manager
      when: molecule_user_session | default(false) | bool
      block:
        - name: Install the D-Bus user session
          ansible.builtin.apt:
            name:
              - dbus
              - dbus-user-session
            state: present
          when: ansible_facts.os_family == "Debian"

        - name: Start the systemd user manager of root
          ansible.builtin.command: loginctl enable-linger root
          changed_when: true

        - name: Wait for the user bus
          ansible.builtin.wait_for:
            path: /run/user/0/bus
            timeout: 60

    - name: Run the extra preparation of the scenario
      ansible.builtin.include_tasks: "{{ extra }}"
      vars:
        extra: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/tasks/prepare.yml"
      when: (lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') ~ '/tasks/prepare.yml') is file
