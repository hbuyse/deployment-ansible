---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family downloads the binary from GitHub, Arch uses its package
  - name: shellcheck-fedora
    image: fedora:latest
    pre_build_image: false
  - name: shellcheck-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: shellcheck-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_pipx: true
verifier:
  name: testinfra
