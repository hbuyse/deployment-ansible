---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  when: shellcheck_packages is defined
  ansible.builtin.package:
    name: "{{ shellcheck_packages }}"
    state: present

- name: "Install from PyPI"
  when: shellcheck_packages is not defined
  community.general.pipx:
    # renovate: datasource=pypi depName=shellcheck-py
    name: "shellcheck-py==0.11.0.1"
    state: "present"
    executable: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
