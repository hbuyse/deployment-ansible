---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  when: shellcheck_packages is defined
  ansible.builtin.package:
    name: "{{ shellcheck_packages }}"
    state: present

- name: "Install from GitHub"
  when: shellcheck_packages is not defined
  block:
    - name: "Get latest version number"
      ansible.builtin.set_fact:
        shellcheck_latest_version: "{{ lookup('github_latest_release', shellcheck_github_user ~ '/' ~ shellcheck_github_repo)[1:]
          }}"

    - name: "Install executable"
      ansible.builtin.unarchive:
        src: "https://github.com/{{ shellcheck_github_user }}/{{ shellcheck_github_repo }}/releases/download/v{{ shellcheck_latest_version
          }}/shellcheck-v{{ shellcheck_latest_version }}.{{ ansible_facts.system | lower }}.{{ ansible_facts.architecture
          }}.tar.gz"
        dest: "{{ ansible_facts.user_dir }}/.local/bin"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
        mode: "0755"
        include:
          - "shellcheck-v{{ shellcheck_latest_version }}/shellcheck"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
