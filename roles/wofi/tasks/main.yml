---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ wofi_packages }}"
    state: present

- name: "Install configuration"
  block:
    - name: "Ensure directory exist"
      ansible.builtin.file:
        path: "{{ wofi_config_dir }}"
        state: directory
        mode: "0755"

    - name: "Copy configuration files"
      ansible.builtin.copy:
        src: "config"
        dest: "{{ wofi_config_dir }}/config"
        mode: "0644"

    - name: "Copy style sheet source"
      ansible.builtin.copy:
        src: "style.scss"
        dest: "{{ wofi_config_dir }}/style.scss"
        mode: "0644"
      register: wofi_scss

    - name: "Check if the style sheet is generated"
      ansible.builtin.stat:
        path: "{{ wofi_config_dir }}/style.css"
      register: wofi_css

    - name: "Generate style sheet"  # noqa: no-handler
      ansible.builtin.command:
        cmd: "sassc -t expanded {{ wofi_config_dir }}/style.scss {{ wofi_config_dir }}/style.css"
      when: wofi_scss is changed or not wofi_css.stat.exists
      changed_when: true
