---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # sassc is not installed by the role but is needed to generate the style sheet
  - name: wofi-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    volumes:
      # Some roles use role_path in a command that runs on the target: the target is the controller on a real run
      - "${MOLECULE_PROJECT_DIRECTORY}:${MOLECULE_PROJECT_DIRECTORY}:ro"
  - name: wofi-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    volumes:
      # Some roles use role_path in a command that runs on the target: the target is the controller on a real run
      - "${MOLECULE_PROJECT_DIRECTORY}:${MOLECULE_PROJECT_DIRECTORY}:ro"
  - name: wofi-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
    volumes:
      - "${MOLECULE_PROJECT_DIRECTORY}:${MOLECULE_PROJECT_DIRECTORY}:ro"
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
scenario:
  # No idempotence step: the role compiles the style sheet again on every run
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: testinfra
