---
- name: "Ensure the binary directory exists"
  ansible.builtin.file:
    path: "{{ direnv_bin_install_dir }}"
    state: directory
    mode: "0755"

# golang_package looks for a binary named after the last element of the path (v2), so ask go for the version
- name: "Get the installed version"
  ansible.builtin.command: "go version -m {{ direnv_bin_install_dir }}/direnv"
  register: direnv_installed
  changed_when: false
  failed_when: false

- name: "Install binary [{{ direnv_version }}]"
  ansible.builtin.command: "go install {{ direnv_golang_name }}@{{ direnv_version }}"
  environment:
    GOBIN: "{{ direnv_bin_install_dir }}"
  when: direnv_installed.stdout is not search(direnv_golang_name ~ '\\s+' ~ direnv_version ~ '\\s')
  changed_when: true

- name: "Ensure Man pages directory exists"
  ansible.builtin.file:
    path: "{{ direnv_man_install_dir }}/man1"
    state: directory
    mode: "0755"

- name: "Install man pages"
  ansible.builtin.unarchive:
    src: "https://github.com/direnv/direnv/archive/refs/tags/{{ direnv_version }}.tar.gz"
    dest: "{{ direnv_man_install_dir }}/man1"
    remote_src: true
    keep_newer: true
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "u=rwX,go=rX"
    include:
      - "direnv-{{ direnv_version[1:] }}/man/direnv.1"
      - "direnv-{{ direnv_version[1:] }}/man/direnv.toml.1"
      - "direnv-{{ direnv_version[1:] }}/man/direnv-fetchurl.1"
      - "direnv-{{ direnv_version[1:] }}/man/direnv-stdlib.1"
    extra_opts:
      - "--strip-components=2"
