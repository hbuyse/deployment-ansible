---
- name: "Get latest version number"
  ansible.builtin.set_fact:
    direnv_latest_version: "{{ lookup('github_latest_release', 'direnv/direnv')[1:] }}"

- name: "Ensure the binary directory exists"
  ansible.builtin.file:
    path: "{{ direnv_bin_install_dir }}"
    state: directory
    mode: "0755"

- name: "Install binary [v{{ direnv_latest_version }}]"
  ansible.builtin.get_url:
    url: "https://github.com/direnv/direnv/releases/download/v{{ direnv_latest_version }}/direnv.{{ ansible_facts.system |
      lower }}-{{ alt_arch }}"
    dest: "{{ direnv_bin_install_dir }}/direnv"
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_uid }}"
    mode: "0755"

- name: "Ensure Man pages directory exists"
  ansible.builtin.file:
    path: "{{ direnv_man_install_dir }}/man1"
    state: directory
    mode: "0755"

- name: "Install man pages"
  ansible.builtin.unarchive:
    src: "https://github.com/direnv/direnv/archive/refs/tags/v{{ direnv_latest_version }}.tar.gz"
    dest: "{{ direnv_man_install_dir }}/man1"
    remote_src: true
    keep_newer: true
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_uid }}"
    mode: "u=rwX,go=rX"
    include:
      - "direnv-{{ direnv_latest_version }}/man/direnv.1"
      - "direnv-{{ direnv_latest_version }}/man/direnv.toml.1"
      - "direnv-{{ direnv_latest_version }}/man/direnv-fetchurl.1"
      - "direnv-{{ direnv_latest_version }}/man/direnv-stdlib.1"
    extra_opts:
      - "--strip-components=2"
