---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  when: ruff_package is defined
  ansible.builtin.package:
    name: "{{ ruff_package }}"
    state: "present"

- name: "Install from PIP"
  when: ruff_package is not defined
  community.general.pipx:
    # renovate: datasource=pypi depName=ruff
    name: "ruff==0.17.2"
    state: "present"
    executable: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
