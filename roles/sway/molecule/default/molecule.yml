---
# Molecule cannot install the role as a Galaxy role: its meta/main.yml has no galaxy_info
prerun: false
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # sway_aur: false on Arch, there is no AUR helper in the container: lxsession-gtk3 is in the AUR only
  - name: sway-fedora
    image: fedora:latest
    dockerfile: ../../../../molecule/shared/Dockerfile.fedora-systemd.j2
    pre_build_image: false
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: sway-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: sway-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections:${HOME}/.ansible/collections"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_user_session: true
        molecule_environment:
          XDG_RUNTIME_DIR: /run/user/0
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
    host_vars:
      sway-archlinux:
        sway_aur: false
verifier:
  name: testinfra
