---
# tasks file for sway
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml') }}"

- name: "Install required packages"
  become: true
  ansible.builtin.package:
    name: "{{ sway_packages }}"

- name: "Copy Sway session files"
  ansible.builtin.include_tasks:
    file: "copy-service.yml"

- name: "Copy configuration"
  ansible.builtin.include_tasks:
    file: "copy-sway-conf.yml"

- name: "Copy preferred-terminal script"
  block:
    - name: "Ensure ~/.local/bin exists"
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.local/bin"
        state: "directory"
        mode: "0755"

    - name: "Copy preferred-terminal script"
      ansible.builtin.copy:
        src: "preferred-terminal.py"
        dest: "{{ ansible_facts.user_dir }}/.local/bin/preferred-terminal"
        mode: "0755"
