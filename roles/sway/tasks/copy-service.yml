---
- name: "Copy lxpolkit service file"
  ansible.builtin.copy:
    src: "service/lxpolkit.service"
    dest: "{{ ansible_facts.user_dir }}/.config/systemd/user"
    mode: "0644"
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"

- name: "Enable lxpolkit service"
  become: false
  ansible.builtin.systemd:
    name: "lxpolkit"
    daemon_reload: true
    enabled: true
    scope: "user"
  tags:
    - lxpolkit
