---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - prettier
    - formatter

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ prettier_packages }}"
    state: present
  tags:
    - prettier
    - formatter
  when: prettier_packages is defined

- name: "Install from Node Package Manager"
  community.general.npm:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    global: true
    state: present
    production: true
    no_optional: true
  tags:
    - prettier
    - formatter
  loop: "{{ prettier_npm_packages }}"
  when: (prettier_packages is not defined) or prettier_force_source_install
