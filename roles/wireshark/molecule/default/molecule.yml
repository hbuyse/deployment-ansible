---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The Debian family task adds an Ubuntu PPA: Debian 12 has no such suite
  - name: wireshark-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: wireshark-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_debian_packages:
          - python3-debian
        molecule_group_vars: true
scenario:
  # No idempotence step: the PPA task sometimes reports a change: the key served by keyserver.ubuntu.com is not
  # always byte for byte the same
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: testinfra
