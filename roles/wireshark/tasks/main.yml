---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', os_vars_files, paths=[role_path ~ '/vars']) }}"

- name: "Add repository"
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', os_vars_files, paths=[role_path ~ '/tasks'], skip=true) }}"

- name: "Enable non-privileged users to run wireshark"
  become: true
  ansible.builtin.debconf:
    name: wireshark-common
    question: wireshark-common/install-setuid
    value: "true"
    vtype: boolean
  when: ansible_facts.os_family == 'Debian'

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ wireshark_packages }}"
    state: "present"
  when: wireshark_packages is defined

- name: "Install configuration files"
  block:
    - name: "Ensure directories exists"
      ansible.builtin.file:
        path: "{{ wireshark_config_dir }}"
        state: directory
        mode: "0755"

    - name: "Copy static configuration files"
      ansible.builtin.copy:
        src: "{{ role_path }}/files/"
        dest: "{{ wireshark_config_dir }}"
        mode: "preserve"
        directory_mode: "0755"

- name: "Add user to group wireshark"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups: "{{ wireshark_group }}"
    append: true
