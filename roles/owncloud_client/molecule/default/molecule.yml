---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The repository URL contains ansible_facts.distribution_version: it exists for Ubuntu 24.04 but not for 12.x of Debian
  - name: owncloud_client-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_debian_packages:
          - python3-debian
        molecule_user_dirs:
          - .config/systemd/user
        molecule_user_session: true
        molecule_group_vars: true
        molecule_environment:
          XDG_RUNTIME_DIR: /run/user/0
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
verifier:
  name: testinfra
