---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The repository URL contains ansible_facts.distribution_version: it exists for Ubuntu 24.04 but not for 12.x of Debian
  - name: owncloud_client-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
