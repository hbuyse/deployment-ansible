---
- name: "Install repository [Debian]"
  become: true
  ansible.builtin.deb822_repository:
    name: owncloud-client
    enabled: true
    types: deb
    uris: "{{ owncloud_client_repository }}/"
    suites: "/"
    architectures:
      - "{{ deb_arch }}"
    signed_by: "{{ owncloud_client_repository }}/Release.key"

- name: "Update APT cache"
  become: true
  ansible.builtin.apt:
    update_cache: true
