---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The docker role enables and restarts the docker service, so the containers run systemd and are privileged
  - name: docker-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # dockerd cannot use overlayfs on top of the container overlayfs
      - /var/lib/docker
      - /var/lib/containerd
  - name: docker-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
