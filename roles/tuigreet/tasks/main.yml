---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - tuigreet
    - greetd

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ tuigreet_packages }}"
    state: present
  tags:
    - tuigreet
    - greetd
  when: tuigreet_packages is defined

- name: "Ensure the greetd configuration directory exists"
  become: true
  ansible.builtin.file:
    path: "/etc/greetd"
    state: directory
    mode: "0755"

- name: "Copy configuration to /etc/greetd"
  become: true
  ansible.builtin.copy:
    src: "config.toml"
    dest: "/etc/greetd/config.toml"
    mode: "0644"
  tags:
    - tuigreet
    - greetd
