---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The role only downloads a script: no package, no need for Arch
  - name: wlprop-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: wlprop-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_user_dirs:
          - .local/bin
verifier:
  name: testinfra
