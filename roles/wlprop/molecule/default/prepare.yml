---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Create the user directories the role expects
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - .local/bin
