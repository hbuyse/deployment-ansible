---
- name: "Ensure the binary directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    mode: "0755"

- name: "Install script"
  become: true
  ansible.builtin.get_url:
    url: "https://gist.githubusercontent.com/crispyricepc/f313386043395ff06570e02af2d9a8e0/raw/758c548bfb4be5b437c428c8062b3987f126f002/wlprop.sh"
    dest: "{{ ansible_facts.user_dir }}/.local/bin/wlprop"
    mode: "0755"
