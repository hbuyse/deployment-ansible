---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ssh-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: ssh-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
  inventory:
    group_vars:
      all:
        ssh_pubkey_email: molecule@example.com
verifier:
  name: testinfra
