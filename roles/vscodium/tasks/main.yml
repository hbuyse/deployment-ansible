---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags: vscodium

- name: "Add dependencies and repo"
  ansible.builtin.include_tasks:
    file: "{{ item }}"
    apply:
      tags: vscodium
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true
  tags: vscodium

- name: "Install packages"
  become: true
  ansible.builtin.package:
    state: present
    name: "{{ vscodium_packages }}"
  tags:
    - vscodium
  when: vscodium_packages is defined

- name: "Install packages from AUR"
  kewlfft.aur.aur:
    name: "{{ vscodium_aur_packages }}"
    use: yay
    state: present
  tags:
    - vscodium
  when:
    - vscodium_aur | bool
    - vscodium_aur_packages is defined
