---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install the Debian family packages the role expects on a regular install
      ansible.builtin.apt:
        name:
          - python3-debian
        state: present
      when: ansible_facts.os_family == "Debian"
