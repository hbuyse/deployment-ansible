---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  when: bashls_package is defined
  ansible.builtin.package:
    name: "{{ bashls_package }}"
    state: present

- name: "Install from Node Package Manager"
  when: bashls_package is not defined
  community.general.npm:
    name: "{{ bashls_npm_package }}"
    # renovate: datasource=npm depName=bash-language-server
    version: "5.8.1"
    global: true
    state: present
    production: true
    no_optional: true
