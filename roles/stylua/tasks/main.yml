---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - stylua
    - formatter

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ stylua_packages }}"
    state: present
  tags:
    - stylua
    - formatter
  when: stylua_packages is defined

- name: "Install Rust package with locked dependencies"
  community.general.cargo:
    name: stylua
    version: "2.6.0"
    state: present
    locked: true
  tags:
    - stylua
    - formatter
  when: (stylua_packages is not defined) or stylua_force_source_install
