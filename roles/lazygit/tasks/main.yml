---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true
  tags:
    - lazygit
    - git

- name: "Install from package manager"
  become: true
  when: lazygit_packages is defined
  tags:
    - lazygit
    - git
  ansible.builtin.package:
    name: "{{ lazygit_packages }}"
    state: "present"

- name: "Install from Golang"
  when: lazygit_packages is not defined
  tags:
    - lazygit
    - git
  block:
    - name: "Get latest version number"
      ansible.builtin.set_fact:
        lazygit_latest_version: "{{ lookup('github_latest_release', lazygit_github_user ~ '/' ~ lazygit_github_repo) }}"

    - name: "Install from Golang"
      community.general.golang_package:
        name: "github.com/{{ lazygit_github_user }}/{{ lazygit_github_repo }}"
        version: "{{ lazygit_latest_version }}"
      environment:
        GOBIN: "{{ lazygit_install_dir }}"

- name: "Install configuration"
  tags:
    - lazygit
    - git
  block:
    - name: "Ensure configuration directory exists"
      ansible.builtin.file:
        path: "{{ lazygit_config_dir }}"
        state: directory
        mode: "0755"

    - name: "Copy configuration"
      ansible.builtin.copy:
        src: "config.yml"
        dest: "{{ lazygit_config_dir }}"
        mode: "0644"
