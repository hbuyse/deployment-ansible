---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # python_aur: false, there is no AUR helper in the container. python-packaging is added: python-virtualenv imports it
  # but the Arch package does not depend on it
  - name: python-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: python-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: python-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections:${HOME}/.ansible/collections"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_arch_packages:
          - python-packaging
    host_vars:
      python-archlinux:
        python_aur: false
verifier:
  name: testinfra
