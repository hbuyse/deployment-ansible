---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ python_packages }}"
    state: present
  when: python_packages is defined

- name: "Install from AUR"
  kewlfft.aur.aur:
    name: "{{ python_aur_packages }}"
    use: yay
    state: present
  when:
    - python_aur | bool
    - python_aur_packages is defined
