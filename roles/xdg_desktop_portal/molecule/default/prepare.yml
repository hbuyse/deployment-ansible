---
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo on Arch
      ansible.builtin.raw: pacman -Syu --noconfirm python sudo
      when: inventory_hostname == "xdg_desktop_portal-archlinux"
      changed_when: true

- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    # A user manager for root, like the session of a desktop user: the roles enable and restart user services
    - name: Install the D-Bus user session
      ansible.builtin.apt:
        name:
          - dbus
          - dbus-user-session
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Start the systemd user manager of root
      ansible.builtin.command: loginctl enable-linger root
      changed_when: true

    - name: Wait for the user bus
      ansible.builtin.wait_for:
        path: /run/user/0/bus
        timeout: 60
