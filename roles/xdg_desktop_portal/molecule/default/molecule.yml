---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The handler restarts a systemd user service: containers run systemd and root has a user manager
  - name: xdg_desktop_portal-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: xdg_desktop_portal-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: xdg_desktop_portal-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_user_session: true
        molecule_environment:
          XDG_RUNTIME_DIR: /run/user/0
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
verifier:
  name: testinfra
