---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true
  tags: eza

- name: "Install Rust package with locked dependencies"
  community.general.cargo:
    name: eza
    state: latest
    locked: true
  notify: "Install eza completions and manpage"
  when: eza_packages is not defined
  tags: eza

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ eza_packages }}"
    state: present
  when: eza_packages is defined
  tags: eza
