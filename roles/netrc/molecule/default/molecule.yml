---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The role only writes a file: no package, no need for Arch
  - name: netrc-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: netrc-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
