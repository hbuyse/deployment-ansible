---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install dependencies"
  become: true
  ansible.builtin.package:
    name: "{{ wallpapers_dependencies }}"
    state: present

- name: "Ensure wallpaper directory exists"
  ansible.builtin.file:
    path: "{{ wallpapers_install_dir }}"
    state: directory
    mode: "0755"

- name: "Install SVG files"
  block:
    - name: "Generate SVG file with colors"
      ansible.builtin.template:
        src: "coding.svg.j2"
        dest: "{{ wallpapers_install_dir }}/coding.svg"
        mode: "0644"
      register: wallpapers_svg

    - name: "Create SVG links"
      ansible.builtin.file:
        src: "{{ wallpapers_install_dir }}/coding.svg"
        dest: "{{ wallpapers_install_dir }}/{{ item }}.svg"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
        state: "link"
      loop:
        - "wallpaper"
        - "locker"

- name: "Install PNG files"
  block:
    - name: "Check if the PNG file is generated"
      ansible.builtin.stat:
        path: "{{ wallpapers_install_dir }}/coding.png"
      register: wallpapers_png

    - name: "Convert SVG to PNG files"  # noqa: no-handler
      ansible.builtin.command:
        cmd: convert {{ wallpapers_install_dir }}/coding.svg {{ wallpapers_install_dir }}/coding.png
      when: wallpapers_svg is changed or not wallpapers_png.stat.exists
      changed_when: true

    - name: "Create PNG links"
      ansible.builtin.file:
        src: "{{ wallpapers_install_dir }}/coding.png"
        dest: "{{ wallpapers_install_dir }}/{{ item }}.png"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
        state: "link"
      loop:
        - "wallpaper"
        - "locker"
