---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - ansiblelint
    - linter

- name: "Install from package manager"
  become: true
  when: ansiblelint_packages is defined
  ansible.builtin.package:
    name: "{{ ansiblelint_packages }}"
    state: "present"
  tags:
    - ansiblelint
    - linter

- name: "Install from PIP"
  when: ansiblelint_packages is not defined
  community.general.pipx:
    # renovate: datasource=pypi depName=ansible-lint
    name: "ansible-lint==26.10.1"
    state: "present"
    executable: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
  tags:
    - ansiblelint
    - linter
