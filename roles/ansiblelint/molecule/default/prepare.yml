---
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo on Arch
      ansible.builtin.raw: pacman -Syu --noconfirm python sudo
      when: inventory_hostname == "ansiblelint-archlinux"
      changed_when: true

- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    # These roles fall back to pipx when the distribution has no package: install it like a regular desktop would
    - name: Install pipx
      ansible.builtin.package:
        name: "{{ 'python-pipx' if ansible_facts.os_family == 'Archlinux' else 'pipx' }}"
        state: present

    - name: Link pipx where the roles look for it
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Link pipx in ~/.local/bin
      ansible.builtin.file:
        src: /usr/bin/pipx
        dest: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
        state: link
