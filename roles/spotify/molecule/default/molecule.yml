---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # spotify-client needs libc6 2.39 or later (not in Debian 12), and Arch installs from the AUR, which needs yay
  - name: spotify-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
  - name: spotify-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins"
  playbooks:
    create: ../../../../molecule/shared/create.yml
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
    destroy: ../../../../molecule/shared/destroy.yml
  inventory:
    group_vars:
      all:
        molecule_debian_packages:
          - python3-debian
verifier:
  name: testinfra
