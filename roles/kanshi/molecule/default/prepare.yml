---
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo on Arch
      ansible.builtin.raw: pacman -Syu --noconfirm python sudo
      when: inventory_hostname == "kanshi-archlinux"
      changed_when: true

- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    # A user manager for root, like the session of a desktop user: the roles enable and restart user services
    - name: Install the D-Bus user session
      ansible.builtin.apt:
        name:
          - dbus
          - dbus-user-session
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Start the systemd user manager of root
      ansible.builtin.command: loginctl enable-linger root
      changed_when: true

    - name: Wait for the user bus
      ansible.builtin.wait_for:
        path: /run/user/0/bus
        timeout: 60

    - name: Create the user directories the role expects
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - .config/systemd/user

    # sway-session.target is deployed by the sway role, which comes first in sway.yml
    - name: Deploy the unit that the services are part of
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../sway/files/service/sway-session.target"
        dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/sway-session.target"
        mode: "0644"
