---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  when: texlab_package is defined
  ansible.builtin.package:
    name: "{{ texlab_package }}"
    state: present

- name: "Install from GitHub"
  when: texlab_package is not defined
  block:
    - name: "Ensure the binary directory exists"
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.local/bin"
        state: directory
        mode: "0755"

    - name: "Get latest version number"
      ansible.builtin.set_fact:
        texlab_latest_version: "{{ lookup('github_latest_release', texlab_github_user ~ '/' ~ texlab_github_repo)[1:] }}"

    - name: "Install executable"
      ansible.builtin.unarchive:
        src: "https://github.com/{{ texlab_github_user }}/{{ texlab_github_repo }}/releases/download/v{{ texlab_latest_version
          }}/texlab-{{ ansible_facts.architecture }}-{{ ansible_facts.system | lower }}.tar.gz"
        dest: "{{ ansible_facts.user_dir }}/.local/bin"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
        mode: "0755"
        include:
          - "texlab"
        remote_src: true
