---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  when: rust_analyzer_package is defined
  ansible.builtin.package:
    name: "{{ rust_analyzer_package }}"
    state: present

- name: "Add rust-analyzer to list of Rustup component"
  when: rust_analyzer_package is not defined
  ansible.builtin.command:
    cmd: rustup component add rust-analyzer
  environment:
    RUSTUP_HOME: "{{ ansible_facts.user_dir }}/.rustup"
    CARGO_HOME: "{{ ansible_facts.user_dir }}/.cargo"
    PATH: "{{ ansible_facts.env.PATH }}:{{ ansible_facts.user_dir }}/.cargo/bin"
  changed_when: false
