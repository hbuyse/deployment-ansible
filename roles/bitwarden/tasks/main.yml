---
- name: "Get latest version number"
  register: bitwarden_releases_json
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ bitwarden_owner }}/{{ bitwarden_repo }}/releases"
    method: GET
    return_content: true
    status_code: 200
    body_format: json
    # Anonymous requests are limited to 60 per hour and per IP address, which the runners of CI share
    headers: "{{ {'Authorization': 'Bearer ' ~ lookup('ansible.builtin.env', 'GITHUB_TOKEN')} if lookup('ansible.builtin.env',
      'GITHUB_TOKEN') else {} }}"

- name: "Set facts"
  ansible.builtin.set_fact:
    bitwarden_desktop_latest_tag: "{{ (bitwarden_releases_json.json | selectattr('tag_name', 'search', '^desktop') | first).tag_name
      }}"
    bitwarden_desktop_latest_version: "{{ (bitwarden_releases_json.json | selectattr('tag_name', 'search', '^desktop') | first).tag_name[9:]
      }}"

- name: "Ensure the binary and applications directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts.user_dir }}/.local/bin"
    - "{{ ansible_facts.user_dir }}/.local/share/applications"

- name: "Install man pages"
  ansible.builtin.get_url:
    url: "https://github.com/{{ bitwarden_owner }}/{{ bitwarden_repo }}/releases/download/{{ bitwarden_desktop_latest_tag
      }}/Bitwarden-{{ bitwarden_desktop_latest_version }}-{{ ansible_facts.architecture }}.AppImage"
    dest: "{{ ansible_facts.user_dir }}/.local/bin/bitwarden"
    mode: "0755"
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"

- name: "Install desktop file"
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/bitwarden/clients/refs/heads/main/apps/desktop/resources/com.bitwarden.desktop.desktop"
    dest: "{{ ansible_facts.user_dir }}/.local/share/applications/"
    mode: "0644"
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"
