---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The role only downloads files: one distribution is enough
  - name: bitwarden-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
verifier:
  name: testinfra
