---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The role only downloads files: one distribution is enough
  - name: bitwarden-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
