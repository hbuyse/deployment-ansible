---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The role only downloads files: one distribution is enough
  - name: bitwarden-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_user_dirs:
          - .local/bin
          - .local/share/applications
verifier:
  name: testinfra
