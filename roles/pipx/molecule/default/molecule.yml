---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family has no package: pipx is installed in a temporary virtualenv then upgraded
  - name: pipx-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: pipx-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: pipx-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
