---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family has no package: pipx is installed in a temporary virtualenv then upgraded
  - name: pipx-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: pipx-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: pipx-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_debian_packages:
          - python3-venv
          - python3-pip
verifier:
  name: testinfra
