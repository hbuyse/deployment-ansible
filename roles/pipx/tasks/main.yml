---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ pipx_packages }}"
    state: "present"
  when: pipx_packages is defined

- name: "Install self-managed Pipx"
  when: pipx_packages is not defined
  block:
    - name: "Create temporary directory"
      ansible.builtin.tempfile:
        state: "directory"
        suffix: "pipx"
      register: pipx_tmpdir

    - name: "Install in temporary venv"  # noqa: package-latest
      ansible.builtin.pip:
        name: "pipx"
        state: "latest"
        virtualenv: "{{ pipx_tmpdir.path }}"
      notify: "Remove pipx temporary venv"

    - name: "Install in user space"
      community.general.pipx:
        name: "pipx"
        state: "latest"
        executable: "{{ pipx_tmpdir.path }}/bin/pipx"

    - name: "Upgrade"
      community.general.pipx:
        name: "pipx"
        state: "latest"
        executable: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
