---
- name: "Update Clang and LLVM alternatives"
  become: true
  community.general.alternatives:
    name: "{{ clang_alternative.name }}"
    link: "/usr/bin/{{ clang_alternative.name }}"
    path: "/usr/bin/{{ clang_alternative.name }}-{{ clang_latest_llvm_version }}"
    priority: 100
    # Same link and versioned path pattern as the master alternative for every subcommand
    subcommands: |-
      {%- set clang_subcommands = [] -%}
      {%- for name in clang_alternative.subcommands -%}
      {%- set _ = clang_subcommands.append({
        'name': name,
        'link': '/usr/bin/' ~ name,
        'path': '/usr/bin/' ~ name ~ '-' ~ clang_latest_llvm_version
      }) -%}
      {%- endfor -%}
      {{- clang_subcommands -}}
  loop: "{{ clang_alternatives }}"
  loop_control:
    loop_var: clang_alternative
    label: "{{ clang_alternative.name }}"
