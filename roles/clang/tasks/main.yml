---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true

- name: "Add LLVM repository"
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true

- name: "Install LLVM packages"
  become: true
  ansible.builtin.package:
    state: present
    name: "{{ clang_packages }}"

- name: "Update Clang and LLVM alternatives [Debian]"
  when: ansible_facts.os_family in ['Debian']
  ansible.builtin.include_tasks:
    file: alternatives.yml

- name: "Copy configuration file"
  tags:
    - clangd
  block:
    - name: "Ensure configuration directory exists"
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/clangd"
        mode: "0755"
        state: "directory"

    - name: "Copy launcher script"
      ansible.builtin.copy:
        src: "config.yaml"
        dest: "{{ clang_clangd_config_dir }}"
        mode: "0755"
