---
- name: "Ensure the AccountsService icons directory exists"
  become: true
  ansible.builtin.file:
    path: "/var/lib/AccountsService/icons"
    state: directory
    mode: "0775"

- name: "Copy the face image in /var/lib/AccountsService/icons"
  become: true
  ansible.builtin.copy:
    src: "face.png"
    dest: "/var/lib/AccountsService/icons/{{ ansible_facts.user_id }}"
    mode: "0644"

- name: "Copy the face image in home directory"
  ansible.builtin.copy:
    src: "face.png"
    dest: "{{ ansible_facts.user_dir }}/.face"
    mode: "0644"
