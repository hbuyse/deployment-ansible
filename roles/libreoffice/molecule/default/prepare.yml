---
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo on Arch
      ansible.builtin.raw: pacman -Syu --noconfirm python sudo
      when: inventory_hostname == "libreoffice-archlinux"
      changed_when: true

- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install the Debian family packages the role expects on a regular install
      ansible.builtin.apt:
        name:
          - python3-debian
        state: present
      when: ansible_facts.os_family == "Debian"

    # The image has no manual directory, which the update-alternatives call of the Java packages needs
    - name: Create the manual directory
      ansible.builtin.file:
        path: /usr/share/man/man1
        state: directory
        mode: "0755"
