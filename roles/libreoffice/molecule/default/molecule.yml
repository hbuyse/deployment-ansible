---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The Debian family task adds an Ubuntu PPA: Debian 12 has no such suite
  - name: libreoffice-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: libreoffice-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
scenario:
  # No idempotence step: the PPA task sometimes reports a change: the key served by keyserver.ubuntu.com is not always byte for byte the same
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: testinfra
