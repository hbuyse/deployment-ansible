---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true
  tags: git

- name: "Install repository [Debian]"
  ansible.builtin.include_tasks:
    file: debian.yml
    apply:
      tags: git
  when: ansible_facts.os_family == 'Debian'
  tags: git

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ git_packages }}"
    state: present
  tags: git

- name: "Copy git configuration"
  tags: git
  block:
    - name: "Ensure configuration directory exists"
      ansible.builtin.file:
        path: "{{ git_config_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
      loop:
        - "{{ git_config_dir }}"
        - "{{ git_config_bin_dir }}"

    - name: "Copy git configuration"
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ git_config_dir }}"
        mode: "0644"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
      loop:
        - config
        - attributes
        - gitk

    - name: "Copy pcap files diff helper"
      ansible.builtin.copy:
        src: "bin/pcap-diff-textconv"
        dest: "{{ git_config_dir }}"
        mode: "0755"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
