---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - isort
    - formatter

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ isort_packages }}"
    state: "present"
  tags:
    - isort
    - formatter
  when: isort_packages is defined

- name: "Install from source"
  community.general.pipx:
    # renovate: datasource=pypi depName=isort
    name: "isort==9.0.2"
    state: "present"
    executable: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
  tags:
    - isort
    - formatter
  when: (isort_packages is not defined) or isort_force_source_install
