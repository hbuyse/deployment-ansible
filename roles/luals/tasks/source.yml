---
- name: "Get latest version number"
  ansible.builtin.set_fact:
    luals_latest_version: "{{ lookup('github_latest_release', luals_github_user ~ '/' ~ luals_github_repo) }}"

- name: "Install latest version"
  become: true
  block:
    - name: "Ensure install directory exists"
      ansible.builtin.file:
        path: "{{ luals_install_dir }}"
        state: directory
        mode: "0755"

    - name: "Install executable"
      ansible.builtin.unarchive:
        src: "https://github.com/{{ luals_github_user }}/{{ luals_github_repo }}/releases/download/{{ luals_latest_version
          }}/lua-language-server-{{ luals_latest_version }}-{{ ansible_facts.system | lower }}-x64.tar.gz"
        dest: "{{ luals_install_dir }}"
        remote_src: true
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
        mode: "u=rwX,go=rX"
