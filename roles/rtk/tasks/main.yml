---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install Rust package from git repository"
  ansible.builtin.command:
    cmd: "cargo install --git https://github.com/{{ rtk_gh_user }}/{{ rtk_gh_repo }} rtk"
    creates: "{{ ansible_facts.user_dir }}/.cargo/bin/rtk"

