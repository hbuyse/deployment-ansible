---
- name: The role refuses a latitude that is not a number
  hosts: all
  gather_facts: true
  tasks:
    - name: Apply the role with a wrong configuration
      block:
        - name: Include the role
          ansible.builtin.include_role:
            name: ../../..  # noqa: role-name[path]
          vars:
            wlsunset_config:
              latitude: north
              longitude: 2.33

        - name: The role should have stopped
          ansible.builtin.fail:
            msg: The wlsunset role accepted a latitude that is not a number
      rescue:
        - name: Check that the assertion is what stopped the role
          ansible.builtin.assert:
            that:
              - "'wlsunset_config must not be empty' in ansible_failed_result.msg"
            quiet: true
