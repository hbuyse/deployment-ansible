---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ pre_commit_packages }}"
    state: "present"
  when: pre_commit_packages is defined

- name: "Install using Pipx"
  community.general.pipx:
    # renovate: datasource=pypi depName=pre-commit
    name: "pre-commit==4.7.0"
    state: "present"
    executable: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
  when: pre_commit_packages is not defined
