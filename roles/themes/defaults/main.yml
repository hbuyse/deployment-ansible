---
# Install the packages that are only in the AUR (Arch Linux) with yay
themes_aur: true

themes_gtk_dir: "{{ ansible_facts.user_dir }}/.local/share/themes"

# Marks what is installed, so that the themes are not downloaded and installed again on every run
themes_state_dir: "{{ ansible_facts.user_dir }}/.local/state/themes"

themes_gtk3_config_dir: "{{ ansible_facts.user_dir }}/.config/gtk-3.0"
themes_gtk4_config_dir: "{{ ansible_facts.user_dir }}/.config/gtk-4.0"

themes_matcha_enable: true
themes_matcha_github_user: "vinceliuice"
themes_matcha_github_repo: "Matcha-gtk-theme"

themes_catppuccin_enable: false
themes_catppuccin_github_user: "Fausto-Korpsvart"
themes_catppuccin_github_repo: "Catppuccin-GTK-Theme"

themes_vimix_cursors_enable: true
themes_vimix_cursors_github_user: "vinceliuice"
themes_vimix_cursors_github_repo: "Vimix-cursors"
