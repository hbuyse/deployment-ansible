---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Ensure directory exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ themes_gtk_dir }}"
    - "{{ themes_gtk3_config_dir }}"
    - "{{ themes_gtk4_config_dir }}"

- name: "Install dependencies"
  become: true
  ansible.builtin.package:
    state: present
    name: "{{ themes_packages }}"
  when: themes_packages is defined

- name: "Install dependencies from AUR"
  kewlfft.aur.aur:
    name: "{{ themes_aur_packages }}"
    use: yay
    state: present
  when:
    - themes_aur | bool
    - themes_aur_packages is defined

- name: "Install Matcha themes"
  ansible.builtin.include_tasks:
    file: "matcha.yml"
  when: themes_matcha_enable

- name: "Install Catppuccin themes"
  ansible.builtin.include_tasks:
    file: "catppuccin.yml"
  when: themes_catppuccin_enable

- name: "Install Vimix Cursors"
  ansible.builtin.include_tasks:
    file: "vimix_cursors.yml"
  when: themes_vimix_cursors_enable
