---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ minicom_packages }}"
    state: present
  when: minicom_packages is defined

- name: "Add '{{ minicom_group }}' group to user"  # noqa: name[template]
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups: "{{ minicom_group }}"
    append: true

- name: "Copy default file"
  ansible.builtin.template:
    src: "minirc.dfl.j2"
    dest: "{{ minicom_dfl_file_location }}"
    mode: "0644"
