---
# Molecule cannot install the role as a Galaxy role: its meta/main.yml has no galaxy_info
prerun: false
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Arch installs swaylock-effects from the AUR, which needs yay
  - name: swaylock-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: swaylock-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins"
  playbooks:
    create: ../../../../molecule/shared/create.yml
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
    destroy: ../../../../molecule/shared/destroy.yml
verifier:
  name: testinfra
