---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Ubuntu installs Chromium as a snap, which cannot run in a container
  - name: webapplications-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: webapplications-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_group_vars: true
verifier:
  name: testinfra
