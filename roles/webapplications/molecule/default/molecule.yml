---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family: the package list is for Ubuntu and chromium-browser is a snap there
  - name: webapplications-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
