---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true

- name: "Install program from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ nvim_package }}"
    state: present
  when: nvim_package is defined

- name: "Install program from static binary"
  when: nvim_package is not defined
  block:
    - name: "Get latest version number"
      ansible.builtin.set_fact:
        nvim_latest_version: "{{ lookup('github_latest_release', 'neovim/neovim')[1:] }}"

    - name: "Ensure .local directory exists"
      become: true
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.local"
        state: directory
        mode: "0755"

    - name: "Install program from static binary"
      become: true
      ansible.builtin.unarchive:
        src: "https://github.com/neovim/neovim/releases/download/v{{ nvim_latest_version }}/nvim-linux-{{ ansible_facts.architecture
          }}.tar.gz"
        dest: "{{ ansible_facts.user_dir }}/.local"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
        remote_src: true
        extra_opts:
          - --strip-components=1

- name: "Ensure configuration folder exists"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ nvim_config_dir }}"
    state: directory

- name: "Copy static files in configuration directory"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/"
    dest: "{{ nvim_config_dir }}/"
    mode: "0644"
    directory_mode: "0755"

- name: "Copy templates files in configuration directory"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ nvim_config_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - "lua/hbuyse/plugins/formatter.lua"
    - "lua/hbuyse/init.lua"
    - "lsp/perlnavigator.lua"

- name: "Sync plugins"
  when: nvim_update_plugins|bool
  ansible.builtin.command: nvim --headless "+Lazy! sync" +qa
  changed_when: false
