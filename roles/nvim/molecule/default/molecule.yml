---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: nvim-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    # Debian uses fallback binary install (no Debian.yml in vars/)
  - name: nvim-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    # Ubuntu uses fallback binary install (os_family=Debian, no Debian.yml in vars/)
  - name: nvim-archlinux
    image: archlinux:base
    pre_build_image: false
    privileged: true
    # Arch doesn't use systemd by default in minimal image
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
      # Archlinux has vars/archlinux.yml -> installs via pacman
provisioner:
  name: ansible
  env:
    # github_latest_release lookup plugin, used to get the latest neovim release
    ANSIBLE_LOOKUP_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../lookup_plugins"
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins"
  playbooks:
    create: ../../../../molecule/shared/create.yml
    converge: converge.yml
    prepare: prepare.yml
    destroy: ../../../../molecule/shared/destroy.yml
  inventory:
    host_vars:
      localhost: {}
  ansible_args: []
verifier:
  name: testinfra
