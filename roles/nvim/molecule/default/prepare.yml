---
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and Ansible on Arch
      ansible.builtin.raw: |
        pacman -Syu --noconfirm python python-pip curl tar gzip openssh sudo rsync unzip &&
        pip3 install --break-system-packages ansible-core
      when: inventory_hostname == "nvim-archlinux"
      changed_when: true

- name: Prepare Arch Linux container
  hosts: all
  gather_facts: true
  tasks: []
