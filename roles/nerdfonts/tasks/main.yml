---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install packages"
  become: true
  ansible.builtin.package:
    state: present
    name: "{{ nerdfonts_packages }}"
  when: nerdfonts_packages is defined

- name: "Install from source"
  when: nerdfonts_packages is not defined
  block:
    - name: "Get latest version number"
      ansible.builtin.set_fact:
        nerdfonts_latest_version: "{{ lookup('github_latest_release', 'ryanoasis/nerd-fonts')[1:] }}"

    - name: "Download fonts"
      ansible.builtin.include_tasks:
        file: font-download.yml
      loop: "{{ nerdfonts_list }}"
