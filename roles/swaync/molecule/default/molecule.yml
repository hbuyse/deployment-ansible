---
# Molecule cannot install the role as a Galaxy role: its meta/main.yml has no galaxy_info
prerun: false
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: swaync-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: swaync-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: swaync-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_debian_packages:
          - xvfb
        molecule_arch_packages:
          - xorg-server-xvfb
        molecule_user_session: true
        molecule_environment:
          XDG_RUNTIME_DIR: /run/user/0
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
          DISPLAY: ":99"
verifier:
  name: testinfra
