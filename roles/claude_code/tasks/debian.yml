---
- name: "Install repository [Debian]"
  become: true
  ansible.builtin.deb822_repository:
    name: claude-code
    enabled: true
    types: deb
    uris: "https://downloads.claude.ai/claude-code/apt/{{ claude_code_channel }}"
    suites: "{{ claude_code_channel }}"
    components: main
    signed_by: "https://downloads.claude.ai/keys/claude-code.asc"
  register: claude_code_apt_repository

- name: "Update APT cache"  # noqa: no-handler
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: claude_code_apt_repository is changed
