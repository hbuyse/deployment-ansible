---
- name: "Get latest version"
  register: claude_code_latest_version
  ansible.builtin.uri:
    url: "{{ claude_code_download_base_url }}/latest"
    method: GET
    return_content: true
    status_code: 200
    body_format: raw
  tags:
    - ai
    - ia
    - claude

- name: "Download latest version"
  ansible.builtin.get_url:
    url: "{{ claude_code_download_base_url }}/{{ claude_code_latest_version.content }}/{{ ansible_facts.system | lower }}-x64/claude"
    dest: "{{ claude_code_install_dir }}"
    owner: "{{ ansible_facts.user_uid }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags:
    - ai
    - ia
    - claude
