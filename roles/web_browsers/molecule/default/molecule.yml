---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Ubuntu installs both browsers as snaps, which cannot run in a container
  - name: web_browsers-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: web_browsers-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins"
  playbooks:
    create: ../../../../molecule/shared/create.yml
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
    destroy: ../../../../molecule/shared/destroy.yml
  inventory:
    group_vars:
      all:
        molecule_group_vars: true
verifier:
  name: testinfra
