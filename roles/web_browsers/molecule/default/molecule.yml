---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Ubuntu installs both browsers as snaps, which cannot run in a container
  - name: web_browsers-fedora
    image: fedora:latest
    pre_build_image: false
  - name: web_browsers-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_group_vars: true
verifier:
  name: testinfra
