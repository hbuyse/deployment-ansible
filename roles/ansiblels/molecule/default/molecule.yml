---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family installs with npm, Arch from its package when there is one
  - name: ansiblels-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: ansiblels-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: ansiblels-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
