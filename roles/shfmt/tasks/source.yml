---
- name: "Ensure the binary directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    mode: "0755"

- name: "Install executable"
  community.general.golang_package:
    name: "{{ shfmt_golang_name }}"
    version: "{{ shfmt_version }}"
  environment:
    GOBIN: "{{ ansible_facts.user_dir }}/.local/bin"
