---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - go
    - termshark

- name: "Install from package manager"
  become: true
  when: termshark_packages is defined
  ansible.builtin.package:
    name: "{{ termshark_packages }}"
    state: present
  tags:
    - go
    - termshark

- name: "Install from Golang"
  when: termshark_packages is not defined
  tags:
    - go
    - termshark
  block:
    - name: "Install from Golang"
      community.general.golang_package:
        name: "{{ termshark_golang_name }}"
        version: "{{ termshark_version }}"
      environment:
        GOBIN: "{{ termshark_install_dir }}"
