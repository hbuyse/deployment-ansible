---
- name: "Get latest version number for '{{ item.name }}'"
  ansible.builtin.set_fact:
    zellij_plugin_latest_version: "{{ lookup('github_latest_release', item.repo) }}"

- name: "Install plugin {{ plugin_version }}"
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/{{ item.repo }}/releases/download/{{ zellij_plugin_latest_version }}/{{ item.name }}.wasm"
    dest: "{{ zellij_plugins_dir }}"
    mode: "0644"
  vars:
    plugin_version: "'{{ item.name }}' [{{ zellij_plugin_latest_version }}]"
