---
- name: "Get latest version number"
  ansible.builtin.set_fact:
    git_delta_latest_version: "{{ lookup('github_latest_release', 'dandavison/delta') }}"

- name: "Install bash completion file"
  block:
    - name: "Ensure config directory exists"
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.local/share/bash-completion/completions"
        state: directory
        mode: "0755"

    - name: "Install completion file"
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/dandavison/delta/refs/tags/{{ git_delta_latest_version }}/etc/completion/completion.bash"
        dest: "{{ ansible_facts.user_dir }}/.local/share/bash-completion/completions/delta"
        mode: "0644"

- name: "Install zsh completion file"
  block:
    - name: "Ensure config directory exists"
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions"
        state: directory
        mode: "0755"

    - name: "Install completion file"
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/dandavison/delta/refs/tags/{{ git_delta_latest_version }}/etc/completion/completion.zsh"
        dest: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions/_delta"
        mode: "0644"
