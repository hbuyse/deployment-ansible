---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: "Create XDG config directory"
      ansible.builtin.file:
        path: /root/.config
        state: directory
        mode: "0755"

    - name: "Create XDG applications directory"
      ansible.builtin.file:
        path: /root/.local/share/applications
        state: directory
        mode: "0755"
