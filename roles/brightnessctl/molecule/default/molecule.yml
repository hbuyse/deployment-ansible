---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: brightnessctl-fedora
    image: fedora:latest
    pre_build_image: false
  - name: brightnessctl-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: brightnessctl-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
verifier:
  name: testinfra
