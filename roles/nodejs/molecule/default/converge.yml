---
- name: Converge
  hosts: all
  gather_facts: true
  pre_tasks:
    # Same fact as pre_tasks/debian.yml, which the nodejs role relies on for the NodeSource repository
    - name: Get dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: nodejs_molecule_dpkg_arch
      changed_when: false
      when: ansible_facts.os_family == "Debian"

    - name: Store DPKG architecture as fact
      ansible.builtin.set_fact:
        deb_arch: "{{ nodejs_molecule_dpkg_arch.stdout }}"  # noqa: var-naming[no-role-prefix]
      when: ansible_facts.os_family == "Debian"
  roles:
    - role: ../../..  # noqa: role-name[path]
