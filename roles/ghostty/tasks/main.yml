---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', os_vars_files, paths=[role_path ~ '/vars'], skip=true) }}"

- name: "Add repository"
  ansible.builtin.include_tasks:
    file: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', os_vars_files, paths=[role_path ~ '/tasks'], skip=true) }}"

- name: "Install packages"
  become: true
  when: ghostty_packages is defined
  ansible.builtin.package:
    name: "{{ ghostty_packages }}"
    state: present
    update_cache: true
  notify:
    - "Enable ghostty service"
    - "Start ghostty service"

- name: "Copy configuration"
  block:
    - name: "Ensure configuration directory exists"
      ansible.builtin.file:
        path: "{{ ghostty_config_dir }}"
        state: "directory"
        mode: "0755"

    - name: "Copy Ghostty configuration files"
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ghostty_config_dir }}"
        mode: "0644"
      with_fileglob:
        - "{{ role_path }}/files/*.ghostty"

    - name: "Copy tab-style CSS file source"
      ansible.builtin.copy:
        src: "tab-style.scss"
        dest: "{{ ghostty_config_dir }}/tab-style.scss"
        mode: "0644"
      register: ghostty_scss

    - name: "Check if the tab-style CSS file is generated"
      ansible.builtin.stat:
        path: "{{ ghostty_config_dir }}/tab-style.css"
      register: ghostty_css

    - name: "Generate tab-style CSS file"  # noqa: no-handler
      ansible.builtin.command:
        cmd: "sassc -t expanded {{ ghostty_config_dir }}/tab-style.scss {{ ghostty_config_dir }}/tab-style.css"
      when: ghostty_scss is changed or not ghostty_css.stat.exists
      changed_when: true

- name: "Override systemd user configuration"
  when: ansible_facts.service_mgr == "systemd"
  block:
    - name: "Ensure ghostty systemd user-space directory exists"
      ansible.builtin.file:
        path: "{{ ghostty_systemd_user_dir }}"
        state: "directory"
        mode: "0755"

    - name: "Copy override.conf file"
      ansible.builtin.copy:
        src: "override.conf"
        dest: "{{ ghostty_systemd_user_dir }}"
        mode: "0644"

- name: "Download themes"
  block:
    - name: "Ensure theme directory exists"
      ansible.builtin.file:
        path: "{{ ghostty_themes_dir }}"
        state: "directory"
        mode: "0755"

    - name: "Copy Ghostty configuration files"
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/catppuccin/ghostty/refs/heads/main/themes/catppuccin-{{ item }}.conf"
        dest: "{{ ghostty_themes_dir }}"
        mode: "0644"
        owner: "{{ ansible_facts.user_uid }}"
        group: "{{ ansible_facts.user_gid }}"
      loop:
        - frappe
        - latte
        - macchiato
        - mocha
