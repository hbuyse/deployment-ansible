---
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo on Arch
      ansible.builtin.raw: pacman -Syu --noconfirm python sudo
      when: inventory_hostname == "ghostty-archlinux"
      changed_when: true

- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Refresh the APT cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install the Debian family packages the role expects on a regular install
      ansible.builtin.apt:
        name:
          - python3-debian
        state: present
      when: ansible_facts.os_family == "Debian"

    # A user manager for root, like the session of a desktop user: the roles enable and restart user services
    - name: Install the D-Bus user session
      ansible.builtin.apt:
        name:
          - dbus
          - dbus-user-session
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Start the systemd user manager of root
      ansible.builtin.command: loginctl enable-linger root
      changed_when: true

    - name: Wait for the user bus
      ansible.builtin.wait_for:
        path: /run/user/0/bus
        timeout: 60

    - name: Create the user directories the role expects
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - .config/systemd/user

    # A terminal cannot start in a container (no GPU, no display): the restart done by the handler must be a no-op
    - name: Create the drop-in directory of the user service
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/systemd/user/app-com.mitchellh.ghostty.service.d"
        state: directory
        mode: "0755"

    - name: Skip the start of the service
      ansible.builtin.copy:
        content: |
          [Unit]
          ConditionPathExists=/nonexistent
        dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/app-com.mitchellh.ghostty.service.d/zz-molecule.conf"
        mode: "0644"
