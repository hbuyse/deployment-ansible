---
# A terminal cannot start in a container (no GPU, no display): the restart done by the handler must be a no-op
- name: Create the drop-in directory of the user service
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/systemd/user/app-com.mitchellh.ghostty.service.d"
    state: directory
    mode: "0755"

- name: Skip the start of the service
  ansible.builtin.copy:
    content: |
      [Unit]
      ConditionPathExists=/nonexistent
    dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/app-com.mitchellh.ghostty.service.d/zz-molecule.conf"
    mode: "0644"
