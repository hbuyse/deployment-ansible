---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family installs from an Ubuntu PPA
  - name: ghostty-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Some roles use role_path in a command that runs on the target: the target is the controller on a real run
      - "${MOLECULE_PROJECT_DIRECTORY}:${MOLECULE_PROJECT_DIRECTORY}:ro"
  - name: ghostty-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Some roles use role_path in a command that runs on the target: the target is the controller on a real run
      - "${MOLECULE_PROJECT_DIRECTORY}:${MOLECULE_PROJECT_DIRECTORY}:ro"
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
scenario:
  # No idempotence step: the role compiles the style sheet again on every run, and the PPA key from the keyserver is not always the same
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: testinfra
