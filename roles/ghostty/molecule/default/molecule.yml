---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family installs from an Ubuntu PPA
  - name: ghostty-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: ghostty-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins"
  playbooks:
    create: ../../../../molecule/shared/create.yml
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
    destroy: ../../../../molecule/shared/destroy.yml
  inventory:
    group_vars:
      all:
        molecule_debian_packages:
          - python3-debian
        molecule_user_session: true
        molecule_group_vars: true
        molecule_environment:
          XDG_RUNTIME_DIR: /run/user/0
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
scenario:
  # No idempotence step: the PPA key from the keyserver is not always the same
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: testinfra
