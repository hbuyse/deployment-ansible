---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true
  tags: fzf

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ fzf_packages }}"
  when: fzf_packages is defined
  tags: fzf

- name: "Install from Golang"
  when: fzf_packages is not defined
  tags: fzf
  block:
    - name: "Get latest version number"
      register: fzf_latest_json
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ fzf_github_user }}/{{ fzf_github_repo }}/releases/latest"
        method: GET
        return_content: true
        status_code: 200
        body_format: json

    - name: "Set facts"
      ansible.builtin.set_fact:
        fzf_latest_version: "{{ fzf_latest_json.json.tag_name }}"

    - name: "Install from Golang"
      community.general.golang_package:
        name: "github.com/{{ fzf_github_user }}/{{ fzf_github_repo }}"
        version: "{{ fzf_latest_version }}"
      environment:
        GOBIN: "{{ fzf_install_dir }}"
