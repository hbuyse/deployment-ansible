---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ fd_packages }}"
    state: present
  when: fd_packages is defined

- name: "Install Rust package with locked dependencies"
  community.general.cargo:
    name: fd-find
    state: latest
    locked: true
  when: fd_packages is not defined
