---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # No vars/debian.yml: Debian falls back to cargo, which needs rustup
  - name: fd-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
