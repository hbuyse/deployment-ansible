---
# Molecule cannot install the role as a Galaxy role: its meta/main.yml has no galaxy_info
prerun: false
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: zsh-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: zsh-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: zsh-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections:${HOME}/.ansible/collections"
    # github_latest_release lookup plugin
    ANSIBLE_LOOKUP_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../lookup_plugins"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_packages:
          - git
          - tar
          - gzip
          - ca-certificates
        molecule_group_vars: true
verifier:
  name: testinfra
