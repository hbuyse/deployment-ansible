---
- name: Pre-install Python on Arch Linux
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python and sudo on Arch
      ansible.builtin.raw: pacman -Syu --noconfirm python sudo
      when: inventory_hostname == "zsh-archlinux"
      changed_when: true

- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    # The role and its dependencies (tmux, oh-my-zsh, direnv, fastfetch) expect these on a regular install
    - name: Install git and archive tools
      ansible.builtin.package:
        name:
          - git
          - tar
          - gzip
          - ca-certificates
        state: present
        update_cache: "{{ ansible_facts.os_family == 'Debian' }}"

    - name: Ensure the user binary directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.local/bin"
        state: directory
        mode: "0755"
