---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # No package anywhere: the static binary is downloaded from GitHub
  - name: perlnavigator-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
  - name: perlnavigator-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
  - name: perlnavigator-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    # github_latest_release lookup plugin
    ANSIBLE_LOOKUP_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../lookup_plugins"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
scenario:
  # No idempotence step: the role downloads and unpacks the release again on every run
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: testinfra
