---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - codespell
    - formatter

- name: "Install from package manager"
  become: true
  ansible.builtin.package:
    name: "{{ codespell_packages }}"
    state: "present"
  tags:
    - codespell
    - formatter
  when: codespell_packages is defined

- name: "Install from source"
  community.general.pipx:
    # renovate: datasource=pypi depName=codespell
    name: "codespell==2.4.3"
    state: "present"
    executable: "{{ ansible_facts.user_dir }}/.local/bin/pipx"
  tags:
    - codespell
    - formatter
  when: (codespell_packages is not defined) or codespell_force_source_install
