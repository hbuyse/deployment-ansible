---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ ansible_facts.os_family | lower }}.yml"

- name: "Install from URI using package manager"
  become: true
  block:
    - name: "Import the signing key of the package"
      ansible.builtin.rpm_key:
        key: "{{ zoom_gpg_key_url }}"
        state: present
      when: ansible_facts.os_family == 'RedHat'

    - name: "Install from URI using APT"
      ansible.builtin.apt:
        deb: "{{ zoom_latest_package_url }}"
        state: present
      when: ansible_facts.os_family == 'Debian'

    - name: "Install from URI using package manager"
      ansible.builtin.package:
        name: "{{ zoom_latest_package_url }}"
        state: present
      when: ansible_facts.os_family != 'Debian'
