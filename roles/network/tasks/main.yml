---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install dependencies"
  become: true
  ansible.builtin.package:
    name: "{{ network_packages }}"
    state: "present"

- name: "Enable NetworkManager service"
  become: true
  ansible.builtin.systemd:
    name: "NetworkManager.service"
    enabled: true
    state: "started"

- name: "Install ethernet configurations"
  become: true
  community.general.nmcli:
    type: ethernet
    conn_name: "{{ item.name }}"
    ifname: ""
    method4: auto
    method6: auto
    state: present
  loop: "{{ network_ethernet_connections }}"

- name: "Install wifi configurations"
  become: true
  community.general.nmcli:
    type: wifi
    conn_name: "{{ item.name }}"
    ssid: "{{ item.name }}"
    wifi_sec:
      key-mgmt: wpa-psk
      psk: "{{ item.psk }}"
    autoconnect: "{{ item.autoconnect }}"
    state: present
  loop: "{{ network_wifi_connections }}"
