---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ thunderbird_packages }}"
    state: "present"
  when: thunderbird_packages is defined

- name: "Install packages with Snap"
  become: true
  community.general.snap:
    name: "{{ thunderbird_snap_package }}"
    state: "present"
    channel: "{{ thunderbird_snap_channel }}"
  when: thunderbird_packages is not defined
