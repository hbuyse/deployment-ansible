---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Debian family installs Thunderbird with snap, which cannot run in a container
  - name: thunderbird-archlinux
    image: archlinux:base
    pre_build_image: false
    # Minimal Arch image has no systemd and no Python, see prepare.yml
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
verifier:
  name: testinfra
