---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ ansible_facts.os_family | lower }}.yml"

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ waybar_packages }}"
    state: "present"

- name: "Get version"
  ansible.builtin.command:
    cmd: "waybar --version"
  register: waybar_version
  changed_when: false

- name: "Extract version"
  ansible.builtin.set_fact:
    waybar_current_version: "{{ waybar_version.stdout | regex_search('[0-9]+.[0-9]+.[0-9]+') }}"

- name: "Install service file"
  block:
    - name: "Copy service file"
      ansible.builtin.copy:
        src: "waybar.service"
        dest: "{{ waybar_systemd_dir }}/waybar-user.service"
        mode: "0644"
        owner: "{{ ansible_facts.user_id }}"
        group: "{{ ansible_facts.user_gid }}"
      notify:
        - "Restart 'waybar-user' service"

    - name: "Remove waybar service file (if present in userspace)"
      ansible.builtin.file:
        path: "{{ waybar_systemd_dir }}/waybar.service"
        state: absent
      notify:
        - "Disable 'waybar' service"

- name: "Install configuration files"
  notify:
    - "Disable 'waybar' service"
    - "Restart 'waybar-user' service"
  block:
    - name: "Ensure directories exists"
      ansible.builtin.file:
        path: "{{ waybar_config_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_facts.user_id }}"
        group: "{{ ansible_facts.user_gid }}"

    - name: "Copy static configuration files"
      ansible.builtin.copy:
        src: "config/"
        dest: "{{ waybar_config_dir }}"
        mode: "preserve"
        directory_mode: "0755"
        owner: "{{ ansible_facts.user_id }}"
        group: "{{ ansible_facts.user_gid }}"

    - name: "Copy style sheet source"
      ansible.builtin.copy:
        src: "style.scss"
        dest: "{{ waybar_config_dir }}/style.scss"
        mode: "0644"
      register: waybar_scss

    - name: "Check if the style sheet is generated"
      ansible.builtin.stat:
        path: "{{ waybar_config_dir }}/style.css"
      register: waybar_css

    - name: "Generate style sheet"  # noqa: no-handler
      ansible.builtin.command:
        cmd: "sassc -t expanded {{ waybar_config_dir }}/style.scss {{ waybar_config_dir }}/style.css"
      when: waybar_scss is changed or not waybar_css.stat.exists
      changed_when: true

    - name: "Copy dynamic configuration files"
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ waybar_config_dir }}/{{ item }}"
        mode: "0644"
        owner: "{{ ansible_facts.user_id }}"
        group: "{{ ansible_facts.user_gid }}"
      loop:
        - sway.jsonc
        - hyprland.jsonc
        - modules.jsonc

- name: "Create virtualenv for Python scripts"
  ansible.builtin.pip:
    name: "{{ waybar_pip_packages }}"
    state: "present"
    virtualenv: "{{ waybar_config_dir }}/scripts/.venv"
