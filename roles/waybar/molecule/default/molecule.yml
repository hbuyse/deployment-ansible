---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The Debian family package list needs libgirepository-2.0-dev, which only Debian 13 and later have
  - name: waybar-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: waybar-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
  inventory:
    group_vars:
      all:
        molecule_arch_packages:
          - python-packaging
        molecule_user_session: true
        molecule_environment:
          XDG_RUNTIME_DIR: /run/user/0
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
verifier:
  name: testinfra
