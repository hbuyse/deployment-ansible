---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install from package manager"
  become: true
  when: tailwindcss_lsp_package is defined
  ansible.builtin.package:
    name: "{{ tailwindcss_lsp_package }}"
    state: present

- name: "Install from Node Package Manager"
  when: tailwindcss_lsp_package is not defined
  community.general.npm:
    name: "{{ tailwindcss_lsp_npm_package }}"
    # renovate: datasource=npm depName=@tailwindcss/language-server
    version: "0.16.0"
    global: true
    state: present
    production: true
    no_optional: true
