---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"
  tags:
    - go
    - gopls

- name: "Install from package manager"
  become: true
  when: gopls_packages is defined
  ansible.builtin.package:
    name: "{{ gopls_packages }}"
    state: present
  tags:
    - go
    - gopls

- name: "Install from Golang"
  when: gopls_packages is not defined
  tags:
    - go
    - gopls
  block:
    - name: "Get latest version number"
      ansible.builtin.set_fact:
        gopls_latest_version: "{{ lookup('github_latest_release', gopls_github_user ~ '/' ~ gopls_github_repo)[6:] }}"

    - name: "Install from Golang"
      community.general.golang_package:
        name: "{{ gopls_golang_name }}"
        version: "{{ gopls_latest_version }}"
      environment:
        GOBIN: "{{ gopls_install_dir }}"
