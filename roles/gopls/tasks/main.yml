---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | lower }}.yml"
      skip: true
  tags:
    - go
    - gopls

- name: "Install from package manager"
  become: true
  when: gopls_package is defined
  ansible.builtin.package:
    name: "{{ gopls_package }}"
    state: present
  tags:
    - go
    - gopls

- name: "Install from Golang"
  when: gopls_package is not defined
  tags:
    - go
    - gopls
  block:
    - name: "Get latest version number"
      register: gopls_latest_json
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ gopls_github_user }}/{{ gopls_github_repo }}/releases/latest"
        method: GET
        return_content: true
        status_code: 200
        body_format: json

    - name: "Set facts"
      ansible.builtin.set_fact:
        gopls_latest_version: "{{ gopls_latest_json.json.tag_name }}"

    - name: "Install from Golang"
      community.general.golang_package:
        name: "{{ gopls_golang_name }}"
        version: "{{ gopls_latest_version }}"
      environment:
        GOBIN: "{{ gopls_install_dir }}"
