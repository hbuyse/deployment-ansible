---
- name: "Include OS specific variables"
  ansible.builtin.include_vars: "{{ item }}"
  loop: "{{ query('ansible.builtin.first_found', ansible_facts.os_family | lower ~ '.yml', skip=true) }}"

- name: "Install packages"
  become: true
  ansible.builtin.package:
    name: "{{ tuned_packages }}"
    state: "present"
  when: tuned_packages is defined

- name: "Enable TuneD service"
  become: true
  ansible.builtin.systemd:
    name: "tuned"
    enabled: true
    state: "started"

- name: "Enable TuneD-PPD service"
  become: true
  ansible.builtin.systemd:
    name: "tuned-ppd"
    enabled: true
    state: "started"
  register: tuned_res
  failed_when: "tuned_res is failed and 'Could not find the requested service' not in tuned_res.msg"
