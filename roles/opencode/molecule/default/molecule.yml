---
driver:
  name: docker

platforms:
  - name: opencode-debian
    image: debian:12
    privileged: true

provisioner:
  name: ansible
  env:
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins"
  playbooks:
    create: ../../../../molecule/shared/create.yml
    prepare: prepare.yml
    converge: converge.yml
    destroy: ../../../../molecule/shared/destroy.yml
  inventory:
    host_vars:
      opencode-debian:
        opencode_providers:
          openai:
            api_key: "sk-test-key-12345"
            api_base: "https://api.openai.com/v1"
        opencode_mcps: {}
        opencode_code_review_model: "gpt-4"

verifier:
  name: testinfra
