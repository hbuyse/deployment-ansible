---
opencode_config_dir: "{{ ansible_facts.user_dir }}/.config/opencode"
opencode_agents_dir: "{{ opencode_config_dir }}/agents"
opencode_providers: {}
opencode_mcps: {}
opencode_code_review_model: null

opencode_npm_package: "@opencode/cli"

# Completion file paths
opencode_zsh_completion_file: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions/_opencode"
opencode_bash_completion_file: "{{ ansible_facts.user_dir }}/.local/share/bash-completion/completions/opencode"
