---
- name: "Get latest version number"
  register: gotmplfmt_latest_json
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ gotmplfmt_github_user }}/{{ gotmplfmt_github_repo }}/releases/latest"
    method: GET
    return_content: true
    status_code: 200
    body_format: json

- name: "Set facts"
  ansible.builtin.set_fact:
    gotmplfmt_latest_version: "{{ gotmplfmt_latest_json.json.tag_name }}"

- name: "Install from Golang"
  community.general.golang_package:
    name: "github.com/{{ gotmplfmt_github_user }}/{{ gotmplfmt_github_repo }}"
    version: "{{ gotmplfmt_latest_version }}"
  environment:
    GOBIN: "{{ gotmplfmt_install_dir }}"
