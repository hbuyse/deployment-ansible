---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The Debian family task adds an Ubuntu PPA: Debian 12 has no such suite
  - name: nextcloud-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: nextcloud-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
scenario:
  # No idempotence step: the PPA task sometimes reports a change: the key served by keyserver.ubuntu.com is not always byte for byte the same
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: testinfra
