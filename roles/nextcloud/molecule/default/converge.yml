---
- name: Converge
  hosts: all
  gather_facts: true
  vars_files:
    # alt_arch and deb_arch, shared by the playbooks of the repository
    - ../../../../group_vars/all.yml
  environment:
    XDG_RUNTIME_DIR: /run/user/0
    DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/0/bus
  roles:
    - role: ../../..  # noqa: role-name[path]
