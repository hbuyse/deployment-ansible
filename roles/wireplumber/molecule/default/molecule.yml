---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # PipeWire refuses to run as root (ConditionUser=!root): the roles runs as a regular user with a systemd user manager
  - name: wireplumber-fedora
    image: fedora:latest
    dockerfile: ../../../../molecule/shared/Dockerfile.fedora-systemd.j2
    pre_build_image: false
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: wireplumber-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: wireplumber-archlinux
    image: archlinux:base
    pre_build_image: false
    # The image has systemd but no Python, see prepare.yml
    privileged: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  inventory:
    host_vars:
      wireplumber-fedora:
        ansible_user: tester
      wireplumber-ubuntu2404:
        ansible_user: tester
      wireplumber-archlinux:
        ansible_user: tester
verifier:
  name: testinfra
