---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # The role only deploys a unit file
  - name: sway_session-fedora
    image: fedora:latest
    pre_build_image: false
  - name: sway_session-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_INJECT_FACTS_AS_VARS: "False"
  playbooks:
    prepare: ../../../../molecule/shared/prepare.yml
    converge: ../../../../molecule/shared/converge.yml
verifier:
  name: testinfra
